name: AI Mock Interview Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install & Lint Client
        working-directory: client
        run: |
          npm ci
          npm run lint --if-present

      - name: Install & Lint Server
        working-directory: server
        run: |
          npm ci
          npm run lint --if-present

  build:
    name: Build & Compile
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Build Server
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Build Client
        working-directory: client
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
        run: |
          npm ci
          npm run build

  docker:
    name: Docker Build & Push
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/surbhi-gohil8/ai-prepgenius-server:latest
            ghcr.io/surbhi-gohil8/ai-prepgenius-server:${{ github.sha }}

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/surbhi-gohil8/ai-prepgenius-client:latest
            ghcr.io/surbhi-gohil8/ai-prepgenius-client:${{ github.sha }}

  deploy:
    name: Deployment (Staging / Production)
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Placeholder
        run: |
          echo "Connecting to production server..."
          echo "ssh user@vps_ip 'cd /app && docker compose pull && docker compose up -d'"
          echo "Deployment completed!"