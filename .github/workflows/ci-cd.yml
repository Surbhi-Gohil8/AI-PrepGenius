name: AI Mock Interview Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-size: 18
          cache: 'npm'

      - name: Lint Client
        run: |
          cd client
          npm ci
          npm run lint --if-present

      - name: Lint Server
        run: |
          cd server
          npm ci
          # If server has a linter script: npm run lint --if-present

  build:
    name: Build & Compile
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-size: 18

      - name: Build Server
        run: |
          cd server
          npm ci
          npm run build

      - name: Build Client
        run: |
          cd client
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

  docker:
    name: Docker Build & Push
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ github.repository }}/server:latest

      - name: Build and Push Client Image
        uses: docker/build-push-action@v4
        with:
          context: ./client
          push: true
          tags: ghcr.io/${{ github.repository }}/client:latest

  deploy:
    name: Deployment (Staging / Production)
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS / Cloud via SSH
        run: |
          echo "Connecting to production server..."
          echo "ssh user@vps_ip 'cd /app && docker compose pull && docker compose up -d'"
          echo "Deployment steps mock successfully finished!"
